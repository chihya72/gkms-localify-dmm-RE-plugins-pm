name: Build, test and publish PM plugins

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'gkms-dlss5/**'
      - 'gkms-localify-dmm-swap/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pm-plugins-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  RELEASE_TAG: pm-build-${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: Download the released RE SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $feed = Join-Path $PWD 'out\sdk'
          [void][IO.Directory]::CreateDirectory($feed)
          [string[]]$arguments = @('release', 'download', 'v2.0.4', '--repo', 'chihya72/gkms-localify-dmm-RE', '--pattern', 'Gkms.Sdk.2.0.4.nupkg', '--dir', $feed)
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'RE SDK download failed' }
      - name: Build DLSS5 and run managed tests
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD 'gkms-dlss5\Build.ps1') -SdkFeed (Join-Path $PWD 'out\sdk')
          if (-not $?) { throw 'DLSS5 build failed' }
          # Native GPU/model tests remain available through Build.ps1 -Test on a suitable local machine.
          [string[]]$arguments = @('run', '--project', (Join-Path $PWD 'gkms-dlss5\ManagedTests.csproj'), '-c', 'Release')
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { throw 'DLSS5 managed tests failed' }
      - name: Build PhotoSwap and run offline and package tests
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD 'gkms-localify-dmm-swap\Build.ps1') -SdkFeed (Join-Path $PWD 'out\sdk')
          if (-not $?) { throw 'PhotoSwap build or tests failed' }
      - name: Prepare Release assets and subscription indexes
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'out\release'
          [void][IO.Directory]::CreateDirectory($stage)
          $plugins = @()
          $master = @()
          $notes = @('# pm 插件发布', '', '本次安装包由 GitHub Actions 构建，包含以下插件：', '')
          foreach ($folder in @('gkms-dlss5', 'gkms-localify-dmm-swap')) {
              $root = Join-Path $PWD $folder
              $manifest = Get-Content -LiteralPath (Join-Path $root 'plugin.json') -Raw | ConvertFrom-Json
              $relative = if ($folder -eq 'gkms-dlss5') { "out\gkms-dlss5-$($manifest.version).zip" } else { "build\$($manifest.id)-$($manifest.version).zip" }
              $source = (Resolve-Path -LiteralPath (Join-Path $root $relative)).Path
              $archive = [IO.Compression.ZipFile]::OpenRead($source)
              try {
                  $entry = $archive.GetEntry('plugin.json')
                  if (-not $entry -or -not $archive.GetEntry($manifest.assembly)) { throw "Incomplete package: $source" }
                  $reader = [IO.StreamReader]::new($entry.Open())
                  try { $packaged = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
                  if (($packaged | ConvertTo-Json -Depth 50 -Compress) -cne ($manifest | ConvertTo-Json -Depth 50 -Compress)) {
                      throw "Package metadata does not match source: $folder"
                  }
              } finally { $archive.Dispose() }
              $zipName = [IO.Path]::GetFileNameWithoutExtension($manifest.assembly) + '-' + $manifest.version + '.zip'
              Copy-Item -LiteralPath $source -Destination (Join-Path $stage $zipName) -Force
              $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$zipName"
              $restart = [bool]$manifest.requiresRestart
              $hotEnable = if ($null -ne $manifest.canHotEnable) { [bool]$manifest.canHotEnable } else { -not $restart }
              $hotDisable = if ($null -ne $manifest.canHotDisable) { [bool]$manifest.canHotDisable } else { -not $restart }
              $settings = @($manifest.settings).Count -gt 0 -or -not [string]::IsNullOrWhiteSpace($manifest.settingsUi)
              $resources = -not [string]::IsNullOrWhiteSpace($manifest.resourceUpdater)
              $plugins += [ordered]@{
                  id = $manifest.id; name = $manifest.name; version = $manifest.version; apiVersion = $manifest.apiVersion
                  author = $manifest.author; description = $manifest.description; downloadUrl = $url; assembly = $manifest.assembly
                  punchline = $manifest.punchline; category = $manifest.category; tags = @($manifest.tags)
                  repositoryUrl = $manifest.repositoryUrl; names = $manifest.names
                  requiresRestart = -not ($hotEnable -and $hotDisable); hasSettingsUi = $settings; hasResourceUpdater = $resources
              }
              $master += [ordered]@{
                  InternalName = $manifest.id; Name = $manifest.name; AssemblyVersion = $manifest.version
                  GkmsApiLevel = $manifest.apiVersion; Author = $manifest.author; Description = $manifest.description
                  DownloadLinkInstall = $url; DownloadLinkUpdate = $url; Assembly = $manifest.assembly
                  Punchline = $manifest.punchline; Category = $manifest.category; Tags = @($manifest.tags)
                  RepoUrl = $manifest.repositoryUrl; Names = $manifest.names
                  RequiresRestart = -not ($hotEnable -and $hotDisable); HasSettingsUi = $settings; HasResourceUpdater = $resources
              }
              $notes += "- $($manifest.name) — $($manifest.id) $($manifest.version)，作者 $($manifest.author)"
          }
          [ordered]@{ schemaVersion = 1; name = 'pm 个人插件仓库'; plugins = @($plugins) } |
              ConvertTo-Json -Depth 50 | Set-Content -LiteralPath (Join-Path $stage 'index.json') -Encoding utf8NoBOM
          ConvertTo-Json -InputObject @($master) -Depth 50 |
              Set-Content -LiteralPath (Join-Path $stage 'pluginmaster.json') -Encoding utf8NoBOM
          $notes += @('', '验证：DLSS5 原生与托管编译、托管测试；照片替换离线功能、软件 DX11 预览与安装包隔离加载测试。', '', 'DLSS5 仍为实验版；CI 不包含真实 NVIDIA 模型或游戏实机验证。')
          $notes | Set-Content -LiteralPath (Join-Path $stage 'RELEASE_NOTES.md') -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        with:
          name: pm-release
          path: out/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: pm-release
          path: out/release
      - name: Publish Release before changing subscription links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'out\release'
          [string[]]$assets = @(Get-ChildItem -LiteralPath $stage -File -Filter '*.zip' | ForEach-Object { $_.FullName })
          $assets += @(Join-Path $stage 'index.json'; Join-Path $stage 'pluginmaster.json')
          [string[]]$arguments = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA,
              '--title', "pm 插件构建 $env:GITHUB_RUN_NUMBER", '--notes-file', (Join-Path $stage 'RELEASE_NOTES.md'), '--draft') + $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Draft Release creation or asset upload failed' }
          [string[]]$arguments = @('release', 'edit', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--draft=false', '--latest')
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
          # Preserve the existing Raw subscription entry points; only the download targets change.
          foreach ($file in @('index.json', 'pluginmaster.json')) {
              Copy-Item -LiteralPath (Join-Path $stage $file) -Destination (Join-Path $PWD $file) -Force
          }
          [string[]]$arguments = @('config', 'user.name', 'github-actions[bot]')
          & git @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Git author setup failed' }
          [string[]]$arguments = @('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          & git @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Git email setup failed' }
          [string[]]$arguments = @('add', '--', 'index.json', 'pluginmaster.json')
          & git @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Index staging failed' }
          [string[]]$arguments = @('commit', '-m', "Update PM subscription for $env:RELEASE_TAG")
          & git @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Index commit failed' }
          [string[]]$arguments = @('push', 'origin', 'HEAD:main')
          & git @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Index push failed; published Release remains available for recovery' }
